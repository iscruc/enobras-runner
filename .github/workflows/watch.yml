# Weekly check (Sundays, after the run) that enobras.app keeps itself up to date (D59). It fails, and GitHub e-mails the owner, when:
# - the site was not updated in the last 36 hours (the daily run failed or stopped);
# - the site lists an item that needs a person past its limit ("attention" in status.json);
# - an access token is expired or expires within 21 days.
# It also keeps this repository active: GitHub turns off schedules in public repositories after 60 days without activity.
# It never re-enables workflows itself: GitHub sends the failure e-mails of a schedule to whoever last enabled it.
name: Watch
on:
  schedule: [{ cron: "30 10 * * 0" }]                     # Sundays 11:30 / 12:30 Madrid, six hours after the weekly run
  workflow_dispatch:
concurrency: { group: watch, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STATUS_URL: ${{ vars.SITE_URL }}/${{ vars.CITY_PATH || 'malaga' }}/data/status.json
    steps:
      - name: The site updated itself and nothing waits for a person
        run: |
          curl -fsS --retry 3 "$STATUS_URL" -o status.json || { echo "::error::status.json could not be read at $STATUS_URL"; exit 1; }
          python3 - <<'EOF'
          import datetime as dt, json, sys
          d = json.load(open("status.json"))
          age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(d["generated"])).total_seconds() / 3600
          bad = [f"the site was last updated {age:.0f} hours ago (limit 36): see the Run workflow"] if age > 36 else []
          bad += [f"needs a person since {i['since']}: {i['text']}" for i in d.get("attention", []) if i.get("overdue")]
          for i in d.get("attention", []):
              if not i.get("overdue"):
                  print(f"open, within its limit: {i['text']} (since {i['since']}, limit {i['limit_days']} days)")
          [print(f"::error::{b}") for b in bad]
          print("ok: up to date, nothing overdue" if not bad else f"failed: {len(bad)} problem(s)")
          sys.exit(1 if bad else 0)
          EOF
      - name: Access tokens still valid
        if: always()
        env: { GH_PAT: "${{ secrets.PRIVATE_REPO_TOKEN }}", CF: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: |
          fail=0
          if [ -n "$GH_PAT" ]; then
            hdr="$(curl -sS -o /dev/null -D - -H "Authorization: Bearer $GH_PAT" "https://api.github.com/repos/${{ vars.PRIVATE_REPO }}" | tr -d '\r')"
            echo "$hdr" | head -1 | grep -q " 200" || { echo "::error::PRIVATE_REPO_TOKEN no longer works: create a new one (docs/launch.md 1b)"; fail=1; }
            exp="$(echo "$hdr" | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')"
            if [ -n "$exp" ]; then
              left=$(( ($(date -d "$exp" +%s) - $(date +%s)) / 86400 ))
              [ "$left" -ge 21 ] || { echo "::error::PRIVATE_REPO_TOKEN expires in $left days: renew it (docs/launch.md 1b)"; fail=1; }
            fi
          fi
          if [ -n "$CF" ]; then
            curl -fsS -H "Authorization: Bearer $CF" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -q '"status":"active"' \
              || { echo "::error::CLOUDFLARE_API_TOKEN is not active: create a new one (docs/launch.md 1b)"; fail=1; }
          fi
          [ "$fail" -eq 0 ] && echo "ok: tokens"
          exit "$fail"
      - name: Keep the schedules on (a commit here when the last one is over 25 days old)
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" --jq '.[0].commit.committer.date')"
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 86400 ))
          if [ "$age" -gt 25 ]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/heartbeat.txt" --jq .sha 2>/dev/null || true)"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/heartbeat.txt" -f message="heartbeat $(date +%F)" \
              -f content="$(date +%F | base64)" ${sha:+-f sha=$sha} >/dev/null && echo "ok: heartbeat"
          else
            echo "ok: last commit $age days ago"
          fi
